<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴잇 비주얼 제안 스튜디오</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f26b1d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제안 스튜디오">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--o:#f26b1d;--o2:#ffefe5;--bd:#e4e4e7;--tx:#18181b;--sub:#71717a;--bg:#f6f6f7;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:15px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;color:var(--tx)}
button:hover{border-color:#bbb}
button.pri{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}
button.pri:hover{filter:brightness(.95)}
button.ghost{border-color:transparent;background:transparent}
button.on{background:var(--o2);border-color:var(--o);color:var(--o);font-weight:700}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--bd);border-radius:7px;padding:7px 9px;width:100%;background:#fff;color:var(--tx)}
textarea{resize:vertical;min-height:60px}
label{font-size:13px;color:var(--sub);font-weight:500;display:block;margin:8px 0 4px}
.hidden{display:none!important}
#app{display:flex;flex-direction:column;height:100vh}
header{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.logo{font-weight:900;font-size:20px;color:var(--o);letter-spacing:.5px}
.logo small{color:var(--tx);font-weight:700;font-size:15px;margin-left:8px}
.tabs{display:flex;gap:4px;margin-left:18px}
.tabs button{border:none;background:transparent;font-size:15px;font-weight:700;color:var(--sub);padding:8px 14px}
.tabs button.act{color:var(--o);background:var(--o2)}
.sp{flex:1}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:#f1f1f3;color:#52525b;white-space:nowrap}
.badge.o{background:var(--o2);color:var(--o)}
.badge.g{background:#dcfce7;color:#15803d}
.badge.r{background:#fee2e2;color:#b91c1c}
.badge.b{background:#dbeafe;color:#1d4ed8}
.badge.y{background:#fef9c3;color:#a16207}
main{flex:1;min-height:0;display:flex}
.view{flex:1;min-height:0;display:flex}
/* editor */
#scrList{width:210px;background:#fff;border-right:1px solid var(--bd);overflow:auto;padding:10px;flex-shrink:0}
.grp{font-size:12px;font-weight:700;color:var(--sub);margin:12px 4px 6px}
.scr{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.scr:hover{background:#f4f4f5}
.scr.act{background:var(--o2);color:var(--o);font-weight:700}
.scr .dot{width:7px;height:7px;border-radius:50%;background:var(--o);margin-left:auto}
#center{flex:1;min-width:0;display:flex;flex-direction:column}
#tool{background:#fff;border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#tool .sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 14px;font-weight:700}
.seg button.act{background:var(--tx);color:#fff}
#stageWrap{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.device{background:#111;border-radius:26px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);position:absolute;transform-origin:0 0}
.stage{width:1200px;height:800px;position:relative;overflow:hidden;background:#fff;border-radius:6px;user-select:none}
.el{position:absolute;overflow:hidden;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:keep-all;line-height:1.3}
.stage{touch-action:none}
.el.edit{cursor:move}
.qk{display:grid;grid-template-columns:58px 1fr;gap:8px 8px;align-items:center;margin-top:12px}
.ql{font-size:14px;font-weight:700;color:#3f3f46}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qr button{flex:1;min-width:44px;padding:9px 6px;font-size:15px}
.qr.sw button{flex:0 0 30px;min-width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #d4d4d8}
.qr.sw button.on{border:3px solid var(--o);box-shadow:0 0 0 2px #fff inset}
details#pAdv{margin-top:14px;border-top:1px solid var(--bd);padding-top:8px}
details#pAdv summary{cursor:pointer;font-weight:700;color:var(--sub);padding:6px 0}
@media (max-width:900px){
  header{height:auto;flex-wrap:wrap;padding:8px 10px;gap:6px}
  .tabs{margin-left:0}
  #editorView{flex-direction:column;overflow:auto}
  #editorView #scrList{width:auto;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;border-right:0;border-bottom:1px solid var(--bd);padding:6px;flex-shrink:0}
  #scrList .grp{display:none}
  #scrList .scr{flex-shrink:0}
  #center{flex:none;height:62vh;min-height:360px}
  #editorView #props{width:auto;border-left:0;border-top:1px solid var(--bd);flex-shrink:0;overflow:visible}
  #reqView{flex-direction:column;overflow:auto}
  #reqList{width:auto;min-width:0;max-height:45vh}
}
.el.edit:hover{outline:2px dashed rgba(242,107,29,.55);outline-offset:-2px}
.el.sel{outline:3px solid var(--o)!important;outline-offset:-3px;z-index:9000}
.el.st-hidden.edit{opacity:.28;outline:2px dashed #999;outline-offset:-2px}
.el.st-disabled{opacity:.42}
.el.prev{cursor:pointer}
.el.prev.noact{cursor:default}
.el.prev:active:not(.noact){filter:brightness(.92)}
.handle{position:absolute;width:34px;height:34px;background:var(--o);border:3px solid #fff;border-radius:50%;cursor:nwse-resize;z-index:9999}
.noteMark{position:absolute;min-width:30px;height:30px;border-radius:15px;background:#7c3aed;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:9500;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3);padding:0 6px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.menuCard{flex-direction:column;align-items:stretch;justify-content:flex-start}
.menuCard .img{flex:1;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-weight:900;position:relative}
.menuCard .info{padding:8px 12px;text-align:left}
.menuCard .nm{font-weight:700}
.menuCard .pr{font-weight:700;color:var(--o);margin-top:2px}
.menuCard .ds{font-size:13px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menuCard.st-soldout .img{filter:grayscale(1)}
.menuCard.st-soldout .nm,.menuCard.st-soldout .pr{color:#a1a1aa!important}
.soldTag{position:absolute;inset:0;background:rgba(40,40,40,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900;letter-spacing:4px}
.list{flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:auto;padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid rgba(128,128,128,.2)}
.row .n{flex:1;font-weight:700}
.row .o{font-size:13px;opacity:.65;font-weight:400;display:block}
.row .q{display:flex;align-items:center;gap:6px}
.row .q b{min-width:22px;text-align:center}
.qb{width:32px;height:32px;border-radius:8px;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit;font-size:18px;padding:0;line-height:1}
.empty{opacity:.5;text-align:center;padding:30px 0}
.tbl{flex-direction:column;align-items:stretch;justify-content:space-between;padding:16px}
.tbl .tn{font-size:24px;font-weight:900}
.tbl .ti{font-size:15px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .tt{font-size:22px;font-weight:900;text-align:right}
.sold{flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:auto;padding:6px}
.sold .row{padding:12px 10px}
.tg{padding:8px 16px;border-radius:20px;font-weight:700;border:none;font-size:15px}
.popup{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9900}
.popup div{background:#fff;border-radius:18px;padding:34px 40px;min-width:420px;text-align:center;font-size:24px;font-weight:700}
.popup button{margin-top:24px;font-size:20px;padding:12px 40px}
/* right panel */
#props{width:310px;background:#fff;border-left:1px solid var(--bd);overflow:auto;padding:14px;flex-shrink:0}
#props h3{margin:0 0 6px;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.g4 label{margin-top:4px}
.colorRow{display:flex;gap:6px;align-items:center}
.colorRow input[type=color]{width:44px;height:36px;padding:2px}
.btnRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.box{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.step{font-size:13px;padding:6px 0;border-bottom:1px solid #f0f0f0}
.step b{color:var(--o)}
/* requests */
#reqView{flex-direction:row}
#reqList{width:44%;min-width:420px;border-right:1px solid var(--bd);background:#fff;display:flex;flex-direction:column}
.filt{padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.filt input{flex:1;min-width:140px}
.filt select{width:auto}
#reqItems{flex:1;overflow:auto}
.ri{padding:12px 14px;border-bottom:1px solid #f0f0f2;cursor:pointer}
.ri:hover{background:#fafafa}
.ri.act{background:var(--o2)}
.ri .t{font-weight:700;font-size:15px;margin:3px 0}
.ri .m{font-size:13px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}
#reqDetail{flex:1;overflow:auto;padding:18px 22px}
#reqDetail h2{margin:4px 0 10px;font-size:22px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kv div:nth-child(odd){color:var(--sub);font-weight:500}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:15px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.cmpWrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--bd);background:#ddd}
.mini .cap{position:absolute;left:8px;top:8px;z-index:9990}
.diff{font-size:14px}
.diff li{margin:3px 0}
.flow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px}
.flow span{padding:4px 9px;border-radius:14px;background:#f1f1f3;color:#71717a;font-weight:700}
.flow span.done{background:#ffe4d4;color:#c2410c}
.flow span.cur{background:var(--o);color:#fff}
.tl{font-size:14px}
.tl .it{padding:9px 0;border-bottom:1px solid #f0f0f2}
.tl .who{font-weight:700}
.tl .when{color:var(--sub);font-size:12px;margin-left:6px}
.tl .log{color:var(--sub)}
/* modal */
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px 22px}
.modal.wide{width:min(1300px,100%)}
.modal h3{margin:0 0 10px;font-size:19px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#18181b;color:#fff;padding:11px 20px;border-radius:10px;font-weight:500;z-index:11000;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.adminList .row{background:#fff}

.src{display:block;font-size:11px;color:#a1a1aa;font-weight:400}
.scr.act .src{color:#f59e6b}
.menuCard{flex-direction:row;align-items:flex-start;justify-content:flex-start}
.mimg{height:100%;flex-shrink:0;position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);font-weight:900;font-size:30px;border-radius:inherit;overflow:hidden}
.menuCard.st-soldout .mimg{filter:grayscale(1)}
.minfo{padding:6px 0 0 20px;text-align:left;min-width:0}
.minfo .nm{font-weight:500}
.minfo .pr{font-weight:700;color:#e8442a;margin-top:4px}
.minfo .ds{font-size:14px;color:#777;margin-top:8px}
.menuCard.st-soldout .minfo .nm,.menuCard.st-soldout .minfo .pr{color:#a1a1aa}
.badge2{position:absolute;left:8px;top:8px;background:#e8442a;color:#fff;font-style:normal;font-size:12px;font-weight:900;padding:3px 7px;border-radius:3px}
.srow{display:flex;align-items:flex-start;gap:8px;padding:5px 10px}
.srow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .o{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow b{font-weight:500;min-width:20px;text-align:right}
.xb{border:none;background:none;color:#999;font-size:15px;padding:0 2px;line-height:1.3}
.v-table{padding:0}
.thead,.trow{display:flex;align-items:center;padding:0 30px}
.thead{background:#f3f3f3;height:44px;font-size:13px;color:#999;flex-shrink:0}
.trow{padding-top:14px;padding-bottom:14px}
.thead .n,.trow .n{flex:1;min-width:0}
.thead .q,.trow .q{width:80px;text-align:center}
.thead .p,.trow .p{width:130px;text-align:right}
.trow .o{display:block;font-size:13px;color:#999}
.v-receipt{padding:0;overflow:hidden}
.rcpt{width:100%;border-collapse:collapse;font-size:inherit}
.rcpt td{border:1px solid #bdbdbd;padding:0 10px;height:40px;background:#e9e9e9}
.rcpt tr.f td{background:#fff}
.rcpt td small{font-size:12px;color:#888}
.rcpt .c{width:44px;text-align:center}.rcpt .r{width:110px;text-align:right}
.rcpt .h td{background:#fff;height:44px}
.rcpt .tot td{color:#e8442a;font-weight:900;font-size:1.15em;height:54px;background:#fff}
.t-option{justify-content:flex-start;gap:10px}
.rd{width:16px;height:16px;border-radius:50%;border:2px solid #c4c4c4;flex-shrink:0;background:#fff}
.rd.sq{border-radius:3px}
.rd.on{border-color:#e8442a;background:radial-gradient(circle,#e8442a 45%,#fff 50%)}
.rd.sq.on{background:#e8442a}
.t-qty{justify-content:space-between}
.t-qty .qb{width:44px;height:40px;border-radius:4px;border:1px solid #ccc;background:#fff;color:#555}
.tbl{padding:10px 12px;justify-content:space-between}
.tbl .tn{font-size:17px;font-weight:700;display:flex;justify-content:space-between}
.tbl .tm{font-size:12px;font-weight:500;opacity:.7}
.tbl .te{text-align:right;font-size:16px;color:#666}
.tbl .tis{flex:1;padding-top:6px}
.tbl .ti{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.tbl .ti span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.tbl .tt{font-size:20px;font-weight:900;text-align:right}
.sold{background:transparent!important}
.kds{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;width:100%;height:100%;padding:4px}
.kc{width:250px;flex-shrink:0;background:#fff;cursor:pointer}
.kc .kh{background:#e8442a;color:#fff;display:flex;justify-content:space-between;padding:12px 14px;font-size:17px}
.kc .ki{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;font-size:16px}
.kc .ki small{display:block;color:#999;font-size:12px}
.kc.done .kh{background:#a8a6a3}.kc.done{opacity:.75}
.arow{display:flex;align-items:center;gap:16px;background:#fff;border-radius:3px;padding:10px 16px;margin-bottom:8px}
.arow .mimg{border-radius:3px}
.arow .n{flex:1;font-weight:700}
.arow .o{display:block;font-size:13px;color:#888;font-weight:400}
.arow .p{width:110px;text-align:right;font-weight:700}
.ck{display:flex;align-items:center;gap:6px;margin:0;color:#444;font-size:15px;font-weight:500;cursor:pointer}
.ck i{width:22px;height:22px;border:2px solid #bbb;border-radius:4px;display:inline-block;background:#fff}
.ck.on i{background:#e8442a;border-color:#e8442a;box-shadow:inset 0 0 0 3px #fff}
.ck.on{color:#e8442a}
.soldTag{position:absolute;inset:0;background:rgba(40,40,40,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900;letter-spacing:4px}
@media (max-width:1100px){#props{width:260px}#scrList{width:170px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">MENUIT<small>비주얼 제안 스튜디오</small></div>
  <div class="tabs">
    <button data-tab="editor" class="act">시안 편집</button>
    <button data-tab="req">요청함 <span id="reqCnt" class="badge o">0</span></button>
    <button data-tab="admin" id="tabAdmin" class="hidden">권한 관리</button>
  </div>
  <div class="sp"></div>
  <span id="storeMode" class="badge">연결 중</span>
  <select id="roleSwitch" style="width:auto" class="hidden"></select>
  <span id="meBadge" class="badge o"></span>
  <button id="bInstall" class="hidden pri">앱 설치</button>
  <button id="bLogout" class="hidden">나가기</button>
</header>
<main>
  <!-- editor -->
  <section class="view" id="editorView">
    <div id="scrList"></div>
    <div id="center">
      <div id="tool">
        <div class="seg"><button id="mEdit" class="act">편집</button><button id="mPrev">실행</button></div>
        <span class="sep"></span>
        <span id="editTools" style="display:contents">
          <button data-add="button">+ 버튼</button>
          <button data-add="text">+ 문구</button>
          <button data-add="box">+ 상자</button>
          <button data-add="menu">+ 메뉴</button>
          <button data-add="image">+ 이미지</button>
          <span class="sep"></span>
          <button id="bUndo" title="Ctrl+Z">되돌리기</button>
          <button id="bRedo" title="Ctrl+Y">다시하기</button>
          <span class="sep"></span>
        </span>
        <select id="catSel" style="width:auto" class="hidden"></select>
        <button id="bAi">AI 초안</button>
        <button id="bCmp">전후 비교</button>
        <button id="bReset">화면 초기화</button>
        <span class="sp"></span>
        <button id="bMore">가져오기·내보내기</button>
        <button class="pri" id="bSubmit">제안 제출</button>
      </div>
      <div id="stageWrap"></div>
    </div>
    <div id="props"></div>
  </section>
  <!-- requests -->
  <section class="view hidden" id="reqView">
    <div id="reqList">
      <div class="filt">
        <input id="fQ" placeholder="제목·매장 검색">
        <select id="fSt"></select>
        <select id="fPr"><option value="">전체 우선순위</option><option>긴급</option><option>높음</option><option>보통</option><option>낮음</option></select>
      </div>
      <div id="reqItems"></div>
    </div>
    <div id="reqDetail"></div>
  </section>
  <!-- admin -->
  <section class="view hidden" id="adminView" style="overflow:auto;padding:22px;display:block"></section>
</main>
</div>
<div id="toast"></div>
<div id="login" class="hidden" style="position:fixed;inset:0;background:#f6f6f7;z-index:12000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto">
  <div class="card" style="width:min(440px,100%);padding:26px">
    <div class="logo" style="font-size:24px">MENUIT</div>
    <div style="font-size:19px;font-weight:700;margin:4px 0 18px">비주얼 제안 스튜디오</div>
    <div class="seg" style="width:100%;display:flex"><button id="lgC" class="act" style="flex:1">고객(매장)</button><button id="lgS" style="flex:1">메뉴잇 직원</button></div>

const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
// 로컬 저장소 (공유 저장이 안 될 때)
function LocalStore(){
  const K = 'menuit.studio.v2.';
  const listeners = new Set(); const tlL = {};
  const all = () => LS.get(K+'requests', {});
  const emit = () => { const a = Object.values(all()); listeners.forEach(f=>f(a)); };
  return {
    mode:'local',
    me: async () => LS.get(K+'me', null) || (LS.set(K+'me','local-user'), 'local-user'),
    subRequests(cb){ listeners.add(cb); cb(Object.values(all())); return ()=>listeners.delete(cb); },
    async saveRequest(r){ const a = all(); a[r.docId] = r; if(!LS.set(K+'requests', a)) throw {code:'quota_exceeded'}; emit(); },
    async deleteRequest(id){ const a = all(); delete a[id]; LS.set(K+'requests', a); emit(); },
    subTimeline(id, cb){ const f = () => cb((LS.get(K+'tl.'+id, [])).sort((a,b)=>a.at-b.at)); tlL[id] = f; f(); return ()=>{ delete tlL[id]; }; },
    async addTimeline(id, ent){ const a = LS.get(K+'tl.'+id, []); a.push(Object.assign({id:uid('t')}, ent)); LS.set(K+'tl.'+id, a); tlL[id] && tlL[id](); },
    async saveVersion(id, v, data){ LS.set(K+'ver.'+id+'.'+v, data); },
    async getVersion(id, v){ return LS.get(K+'ver.'+id+'.'+v, null); },
    async loadDraft(){ return LS.get(K+'draft', null); },
    async saveDraft(d){ return LS.set(K+'draft', d); },
    subRoles(cb){ cb(LS.get(K+'roles', {})); return ()=>{}; },
    async saveRoles(r){ LS.set(K+'roles', r); }
  };
}

function CloudStore(db, user, myId){
  return {
    mode:'cloud',
    me: async () => myId,
    subRequests(cb, onErr){ return db.collection('requests').orderBy('createdAt','desc').limit(1000).onSnapshot(s => cb(s.docs.map(d => d.data())), onErr); },
    async saveRequest(r){ await db.doc('requests/'+r.docId).set(r); },
    async deleteRequest(id){ await db.doc('requests/'+id).delete(); },
    subTimeline(id, cb){ return db.collection('requests/'+id+'/timeline').orderBy('at','asc').limit(500).onSnapshot(s => cb(s.docs.map(d=>d.data())), ()=>{}); },
    async addTimeline(id, ent){ await db.collection('requests/'+id+'/timeline').add(ent); },
    async saveVersion(id, v, data){ await db.doc('requests/'+id+'/versions/v'+v).set(data); },
    async getVersion(id, v){ const s = await db.doc('requests/'+id+'/versions/v'+v).get(); return s.exists ? s.data() : null; },
    async loadDraft(){ const s = await db.doc('data/users/'+myId+'/draft').get(); return s.exists ? s.data() : null; },
    async saveDraft(d){ await db.doc('data/users/'+myId+'/draft').set(d); return true; },
    subRoles(cb){ return db.doc('config/roles').onSnapshot(s => cb(s.exists ? (s.data().members||{}) : {}), ()=>cb({})); },
    async saveRoles(r){ await db.doc('config/roles').set({members:r}); }
  };
}

function SupaStore(token){
  const call = (fn, a) => rpc(fn, Object.assign({p_token:token}, a||{}));
  const reqCbs = new Set(); let reqTimer = null; const tls = {};

  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pullReqs(); });
  return {
    mode:'supa',
    call, pullReqs,
    subRequests(cb, onErr){ cb.err = onErr; reqCbs.add(cb); pullReqs(); if(!reqTimer) reqTimer = setInterval(pullReqs, 20000); return ()=>reqCbs.delete(cb); },
    async saveRequest(r){ await call('vs_save_request', {p_req:r}); pullReqs(); },
    async deleteRequest(id){ await call('vs_delete_request', {p_id:id}); pullReqs(); },

    async addTimeline(id, ent){ await call('vs_add_timeline', {p_req:id, p_ent:ent}); tls[id] && tls[id](); },
    async saveVersion(id, v, data){ await call('vs_save_version', {p_req:id, p_v:v, p_data:data}); },

function tpl(text){

      case 'tableTotal': return won(tableTotal(s.table));

      case 'ctxTableTotalN': return num(tableTotal(s.ctx.table));

function hashColor(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; const hue=h%360; return `linear-gradient(135deg,hsl(${hue},45%,58%),hsl(${(hue+30)%360},50%,40%))`; }

function elStyle(el){
  const a = [`left:${el.x}px`,`top:${el.y}px`,`width:${el.w}px`,`height:${el.h}px`];
  if(el.bg) a.push(`background:${el.bg}`);
  if(el.color) a.push(`color:${el.color}`);
  if(el.fs) a.push(`font-size:${el.fs}px`);
  if(el.fw) a.push('font-weight:700'); else if(el.type==='button') a.push('font-weight:500');
  if(el.radius) a.push(`border-radius:${el.radius}px`);
  if(el.type==='text'){ a.push(`justify-content:${el.align==='center'?'center':el.align==='right'?'flex-end':'flex-start'}`); a.push(`text-align:${el.align||'left'}`); }
  if(el.pad) a.push(`padding:0 ${el.pad}px`);
  if(el.va==='top') a.push('align-items:flex-start');
  if(el.border) a.push(`border:${el.type==='button'?1:2}px solid ${el.border}`);
  return a.join(';');
}
function imgBox(src, name, sold, soldText, badge, extraStyle){
  const bg = src ? `background-image:url(${src})` : `background:${hashColor(name)}`;
  return `<div class="mimg" style="${bg};${extraStyle||''}">${(!src && !sold)?`<span>${esc((name||'').replace(/\(.*\)/,'').slice(0,4))}</span>`:''}${badge?`<i class="badge2">${esc(badge)}</i>`:''}${sold?`<div class="soldTag">${esc(soldText||'품절')}</div>`:''}</div>`;
}
function mergeItems(orders){
  const m = new Map();
  orders.forEach(o=>o.items.forEach(i=>{ const k = i.name+'|'+i.opts+'|'+i.price; const c = m.get(k); if(c) c.qty += i.qty; else m.set(k, Object.assign({}, i)); }));
  return [...m.values()];
}

function innerOf(el){
  const S = st.sim;
  switch(el.type){
    case 'menu': {
      const sold = effState(el)==='soldout';
      return imgBox(el.img, el.name, sold, el.soldText, el.badge, `width:${Math.round(el.h*1.5)}px`) +
        `<div class="minfo"><div class="nm">${esc(el.name)}</div><div class="pr">${won(el.price)}</div>${el.desc?`<div class="ds">${esc(el.desc)}</div>`:''}</div>`;
    }
    case 'image': {
      if(el.bind==='ctxMenu'){ const m = S.ctx.menu; return imgBox(m&&m.img, m?m.name:'메뉴 사진', false, '', '', 'width:100%'); }
      return el.img ? `<img src="${el.img}" style="width:100%;height:100%;object-fit:${el.fit||'cover'}">` : `<div style="opacity:.5">이미지</div>`;
    }
    case 'cartList': {
      if(el.variant==='sheet'){
        if(!S.cart.length) return `<div style="padding:4px 10px;opacity:.9">메뉴를 선택해주세요</div>`;
        return S.cart.map((c,i)=>`<div class="srow"><div class="n">${esc(c.name)}${c.opts?`<span class="o">${esc(c.opts)}</span>`:''}</div><b>${c.qty}</b><button class="xb" data-cart="del" data-i="${i}">✕</button></div>`).join('');
      }
      if(!S.cart.length) return `<div class="empty">선택한 메뉴가 없습니다</div>`;
      return S.cart.map((c,i)=>`<div class="row"><div class="n">${esc(c.name)}${c.opts?`<span class="o">${esc(c.opts)}</span>`:''}<span class="o">${won(c.price)}</span></div>
        <div class="q"><button class="qb" data-cart="dec" data-i="${i}">−</button><b>${c.qty}</b><button class="qb" data-cart="inc" data-i="${i}">+</button></div></div>`).join('');
    }
    case 'orderList': {
      let items;
      if(el.scope==='last') items = S.lastItems || [];
      else items = mergeItems(tableOrders(el.scope==='ctx' ? S.ctx.table : S.table));
      if(el.variant==='table'){
        return `<div class="thead"><span class="n">메뉴</span><span class="q">수량</span><span class="p">가격</span></div>` +
          (items.length ? items.map(i=>`<div class="trow"><span class="n">${esc(i.name)}${i.opts?`<span class="o">${esc(i.opts)}</span>`:''}</span><span class="q">${i.qty}</span><span class="p">${won(i.price*i.qty)}</span></div>`).join('') : `<div class="empty">주문 내역이 없습니다</div>`);
      }
      if(el.variant==='receipt'){
        const rows = items.map(i=>`<tr class="f"><td>${esc(i.name)}${i.opts?`<br><small>${esc(i.opts)}</small>`:''}</td><td class="c">${i.qty}</td><td class="r">${num(i.price*i.qty)}</td></tr>`);
        while(rows.length < 9) rows.push('<tr><td>&nbsp;</td><td></td><td></td></tr>');
        const q = items.reduce((s,i)=>s+i.qty,0), t = items.reduce((s,i)=>s+i.price*i.qty,0);
        return `<table class="rcpt"><tr class="h"><td colspan="3"><span style="color:${R}">🔔</span><b style="float:right;font-size:1.25em">${esc(S.ctx.table||'-')}</b></td></tr>${rows.join('')}<tr class="tot"><td>합계</td><td class="c">${q}</td><td class="r">${num(t)}</td></tr></table>`;
      }
      if(!items.length) return `<div class="empty">주문 내역이 없습니다</div>`;
      return items.map(i=>`<div class="row"><div class="n">${esc(i.name)}${i.opts?`<span class="o">${esc(i.opts)}</span>`:''}</div><div>${i.qty}</div><div style="min-width:90px;text-align:right">${won(i.price*i.qty)}</div></div>`).join('');
    }
    case 'table': {
      const os = tableOrders(el.tableNo); const tot = tableTotal(el.tableNo);
      if(!os.length) return `<div class="tn">${esc(el.tableNo)}</div><div class="te">빈 테이블</div>`;
      const items = mergeItems(os); const last = os[os.length-1];
      return `<div class="tn">${esc(el.tableNo)}<span class="tm">${fmtT(last.at).slice(11)}</span></div><div class="tis">${items.slice(0,3).map(i=>`<div class="ti"><span>${esc(i.name)}</span><span>${i.qty}</span></div>`).join('')}</div><div class="tt">${num(tot)}</div>`;
    }
    case 'soldoutPanel': {
      const menus = st.draft.screens.main.els.filter(e=>e.type==='menu');
      const cur = (m) => st.mode==='prev' ? (S.pending[m.id] || S.over[m.id] || m.state || 'normal') : (m.state||'normal');
      return menus.map(m=>{ const s = cur(m);
        return `<div class="arow">${imgBox(m.img, m.name, false, '', '', 'width:96px;height:64px;font-size:13px')}
          <div class="n">${esc(m.name)}<span class="o">${esc(m.cat||'')}${m.desc?' · '+esc(m.desc):''}</span></div>
          <div class="p">${num(m.price)} ₩</div>
          <label class="ck ${s==='hidden'?'on':''}" data-flag="hidden" data-mid="${m.id}"><i></i>숨김</label>
          <label class="ck ${s==='soldout'?'on':''}" data-flag="soldout" data-mid="${m.id}"><i></i>품절</label></div>`; }).join('');
    }
    case 'option': {
      const on = st.mode==='prev' && S.opts[el.id];
      return `<span class="rd ${el.single?'':'sq'} ${on?'on':''}"></span><span>${esc(el.text)}${el.addPrice?` (+${num(el.addPrice)})`:''}</span>`;
    }
    case 'kdsBoard': {
      const os = [...S.orders].sort((a,b)=>a.at-b.at);
      if(!os.length) return `<div style="color:#aaa;padding:30px">들어온 주문이 없습니다</div>`;
      return `<div class="kds">` + os.map(o=>{ const done = S.kdsDone[o.no]; const mins = Math.max(0, Math.round((Date.now()-o.at)/60000));
        return `<div class="kc ${done?'done':''}" data-kds="${esc(o.no)}"><div class="kh"><b>${esc(o.table)}</b><span>${mins?mins+'분 전':'방금전'}</span></div>${o.items.map(i=>`<div class="ki"><span>${esc(i.name)}${i.opts?`<small>${esc(i.opts)}</small>`:''}</span><b>${i.qty}</b></div>`).join('')}</div>`; }).join('') + `</div>`;
    }
    case 'qty': return `<button class="qb" data-qty="dec">−</button><b>${st.mode==='prev'?(S.optQty||1):1}</b><button class="qb" data-qty="inc">+</button>`;
    default: return esc(tpl(el.text||''));
  }
}

function renderStage(stageEl, screen, mode, opts){
  opts = opts || {};
  const isEdit = mode==='edit';
  const screens = opts.screens || st.draft.screens;
  let html = '';
  const drawEls = (sc, interactive) => {
    let h='';
    for(const el of sc.els){
      const s = effState(el);
      if(!isEdit && s==='hidden') continue;
      if(sc.cats && el.cat && el.cat !== st.cat) continue;
      let cls = 'el t-'+el.type;
      if(el.type==='menu') cls+=' menuCard';
      if(el.type==='cartList'||el.type==='orderList') cls+=' list';
      if(el.type==='orderList' && el.variant) cls+=' v-'+el.variant;
      if(el.type==='table') cls+=' tbl';
      if(el.type==='soldoutPanel') cls+=' sold';
      cls += ' st-'+s;
      if(interactive){ cls += isEdit ? ' edit' : ' prev'; if(!isEdit && (!el.action||el.action.type==='none') && !['option','qty','cartList','soldoutPanel'].includes(el.type)) cls+=' noact'; }
      if(interactive && isEdit && st.sel===el.id && !opts.noSel) cls += ' sel';
      let style = elStyle(el);
      if(el.catBtn && el.catBtn===st.cat){ style += el.activeColor ? `;color:${el.activeColor};font-weight:700` : `;background:${el.activeBg||O}`; }
      if(el.type==='table' && tableOrders(el.tableNo).length) style += ';background:#ffffff;color:#222';
      if(!interactive) style += ';pointer-events:none';
      h += `<div class="${cls}" data-eid="${el.id}" style="${style}">${innerOf(el)}</div>`;
      if(el.note && (isEdit || opts.notes)) h += `<div class="noteMark" style="left:${Math.min(el.x+el.w-18,1170)}px;top:${Math.max(el.y-10,0)}px">${opts.noteIdx ? opts.noteIdx(el.id) : '!'}</div>`;
    }
    return h;
  };
  const drawBase = (sc, depth) => {
    if(!sc.base || depth > 3) return '';
    const b = screens[sc.base]; if(!b) return '';
    return drawBase(b, depth+1) + drawEls(b,false) + '<div class="dim"></div>';
  };
  html += drawBase(screen, 0);
  html += drawEls(screen, !opts.static);
  if(isEdit && st.sel && !opts.noSel && !opts.static){ const el = screen.els.find(e=>e.id===st.sel); if(el) html += `<div class="handle" data-h="1" style="left:${el.x+el.w-11}px;top:${el.y+el.h-11}px"></div>`; }
  if(!isEdit && st.sim.popup && !opts.static) html += `<div class="popup"><div>${esc(st.sim.popup)}<br><button class="pri" data-popok="1">확인</button></div></div>`;
  stageEl.innerHTML = html;
}

/* 축소 미리보기 */
function miniStage(container, screen, screens, notesFn){
  const w = container.clientWidth || 500; const sc = w/1200;
  container.style.height = (800*sc)+'px';
  container.innerHTML = '';
  const s = document.createElement('div'); s.className='stage'; s.style.transform=`scale(${sc})`; s.style.transformOrigin='0 0'; s.style.position='absolute';
  container.appendChild(s);
  const keepScr = st.draft; const keepMode = st.mode; const keepSel = st.sel; const keepCat = st.cat;
  // 메뉴판처럼 카테고리가 있는 화면은 변경된 메뉴가 있는 카테고리를 보여줌
  const catScreen = screen.cats ? screen : (screen.base && screens[screen.base] && screens[screen.base].cats ? screens[screen.base] : null);
  if(catScreen){
    const t = TEMPLATES[catScreen.id]; const tm = {}; (t?t.els:[]).forEach(e=>tm[e.id]=JSON.stringify(e));
    const hit = catScreen.els.find(e=>e.cat && tm[e.id]!==JSON.stringify(e));
    st.cat = hit ? hit.cat : catScreen.cats[0];
  }
  st.draft = {screens}; st.mode='edit';
  try{ renderStage(s, screen, 'edit', {static:true, noSel:true, notes:true, screens, noteIdx:notesFn}); } finally { st.draft = keepScr; st.mode = keepMode; st.sel = keepSel; st.cat = keepCat; }
}

/* =================== 편집기 UI =================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let stageEl, deviceEl;

function changedScreens(d){
  d = d || st.draft;
  return SCREEN_ORDER.filter(id => JSON.stringify(d.screens[id]) !== JSON.stringify(TEMPLATES[id]));
}

function renderScrList(){
  const ch = new Set(changedScreens());
  const groups = {};
  SCREEN_ORDER.forEach(id => { const s = st.draft.screens[id]; (groups[s.app] = groups[s.app]||[]).push(s); });
  $('#scrList').innerHTML = Object.entries(groups).map(([g,ss])=>`<div class="grp">${esc(g)}</div>`+ss.map(s=>`<div class="scr ${s.id===st.scr?'act':''}" data-scr="${s.id}"><span>${esc(s.name)}${s.src?`<small class="src">${esc(s.src)}</small>`:''}</span>${ch.has(s.id)?'<span class="dot" title="변경됨"></span>':''}</div>`).join('')).join('') +
    '';
}

function fitStage(){
  const wrap = $('#stageWrap'); const W = wrap.clientWidth, H = wrap.clientHeight;
  const sc = Math.min((W-30)/1236, (H-30)/836, 1.2);
  deviceEl.style.transform = `scale(${sc})`;
  deviceEl.style.left = ((W - 1236*sc)/2)+'px'; deviceEl.style.top = ((H - 836*sc)/2)+'px';
  st.scale = sc;
}

function render(){
  renderStage(stageEl, scr(), st.mode);
  const cs = scr().cats;
  $('#catSel').classList.toggle('hidden', !cs || st.mode!=='edit');
  if(cs) $('#catSel').innerHTML = cs.map(c=>`<option ${c===st.cat?'selected':''}>${esc(c)}</option>`).join('');
  $('#bUndo').disabled = !st.undo.length; $('#bRedo').disabled = !st.redo.length;
}
function renderAll(){ renderScrList(); render(); renderProps(); }

/* undo */
function snapshot(){ return JSON.stringify(st.draft.screens); }
let pendingSnap = null;
function pushUndo(snap){ st.undo.push(snap || snapshot()); if(st.undo.length>60) st.undo.shift(); st.redo = []; }
function commit(snap){ pushUndo(snap); saveDraftSoon(); renderScrList(); render(); }
function doUndo(){ if(!st.undo.length) return; st.redo.push(snapshot()); st.draft.screens = JSON.parse(st.undo.pop()); fixSel(); saveDraftSoon(); renderAll(); }
function doRedo(){ if(!st.redo.length) return; st.undo.push(snapshot()); st.draft.screens = JSON.parse(st.redo.pop()); fixSel(); saveDraftSoon(); renderAll(); }
function fixSel(){ if(st.sel && !findEl(st.sel)) st.sel = null; }

let saveTimer = null, saving = false, saveAgain = false;
function saveDraftSoon(){ st.draft.updatedAt = Date.now(); clearTimeout(saveTimer); saveTimer = setTimeout(saveDraftNow, 900); }
async function saveDraftNow(){
  if(st.viewOnly) return;
  if(saving){ saveAgain = true; return; }
  saving = true;
  try{ const ok = await st.store.saveDraft({ver:st.draft.ver, screens:st.draft.screens, updatedAt:st.draft.updatedAt, editing:st.editing||null}); if(ok===false) toast('시안 임시 저장에 실패하였습니다. 이미지 용량을 줄여 주십시오.'); }
  catch(e){ toast(e && e.code==='invalid_argument' ? '시안 용량이 커서 임시 저장되지 않았습니다. 이미지를 줄여 주십시오.' : '시안 임시 저장에 실패하였습니다.'); }
  saving = false; if(saveAgain){ saveAgain=false; saveDraftNow(); }
}

function toHex(c){ if(/^#[0-9a-f]{6}$/i.test(c)) return c; if(/^#[0-9a-f]{3}$/i.test(c)) return '#'+c.slice(1).split('').map(x=>x+x).join(''); return '#ffffff'; }
function deleteSel(){ if(!st.sel) return; const s=snapshot(); const a=scr().els; const i=a.findIndex(e=>e.id===st.sel); if(i<0) return; a.splice(i,1); st.sel=null; commit(s); renderProps(); }

let imgTarget = null;
$('#fileImg').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f || !imgTarget) return;
  try{
    const url = await shrinkImage(f, 360);
    const el = findEl(imgTarget); if(!el) return;
    const s = snapshot(); el.img = url; commit(s); renderProps();
  }catch(err){ toast('이미지를 불러오지 못했습니다.'); }
});
function shrinkImage(file, max){
  return new Promise((res,rej)=>{
    const r = new FileReader(); r.onerror = rej;
    r.onload = ()=>{ const im = new Image(); im.onerror = rej; im.onload = ()=>{
      const k = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.72)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* 드래그 */
let drag = null;
function stagePoint(ev){ const r = stageEl.getBoundingClientRect(); return {x:(ev.clientX-r.left)/st.scale, y:(ev.clientY-r.top)/st.scale}; }
function onStageDown(ev){
  if(st.mode!=='edit') return;
  const h = ev.target.closest('[data-h]');
  const node = ev.target.closest('[data-eid]');
  if(h && st.sel){ const el = findEl(st.sel); drag = {kind:'resize', el, snap:snapshot(), p:stagePoint(ev), ow:el.w, oh:el.h, moved:false}; ev.preventDefault(); stageEl.setPointerCapture(ev.pointerId); return; }
  if(!node){ st.sel=null; render(); renderProps(); return; }
  const el = findEl(node.dataset.eid); if(!el) return;
  const changed = st.sel !== el.id; st.sel = el.id;
  if(changed){ render(); renderProps(); }
  if(!el.lock){ drag = {kind:'move', el, snap:snapshot(), p:stagePoint(ev), ox:el.x, oy:el.y, moved:false}; stageEl.setPointerCapture(ev.pointerId); }
  ev.preventDefault();
}
function onStageMove(ev){
  if(!drag) return;
  const p = stagePoint(ev); const dx = Math.round(p.x-drag.p.x), dy = Math.round(p.y-drag.p.y);
  if(Math.abs(dx)+Math.abs(dy) > 2) drag.moved = true;
  if(!drag.moved) return;
  const el = drag.el;
  if(drag.kind==='move'){ el.x = Math.max(-el.w+20, Math.min(1180, drag.ox+dx)); el.y = Math.max(-el.h+20, Math.min(780, drag.oy+dy)); }
  else { el.w = Math.max(20, drag.ow+dx); el.h = Math.max(20, drag.oh+dy); }
  const n = stageEl.querySelector(`[data-eid="${el.id}"]`);
  if(n){ n.style.left=el.x+'px'; n.style.top=el.y+'px'; n.style.width=el.w+'px'; n.style.height=el.h+'px'; }
  const hd = stageEl.querySelector('[data-h]'); if(hd){ hd.style.left=(el.x+el.w-11)+'px'; hd.style.top=(el.y+el.h-11)+'px'; }
}
function onStageUp(){
  if(!drag) return; const d = drag; drag = null;
  if(d.moved){ commit(d.snap); renderProps(); }
}

/* =================== 실행(시뮬레이션) =================== */
function logStep(el, label){
  st.sim.steps.push({scr:st.scr, scrName:scr().name, el:el?el.id:'', elName: el ? (el.text||el.name||TYPES[el.type]) : '', act:label, at:Date.now()});
  if(st.sim.steps.length>200) st.sim.steps.shift();
}
function go(target, push){
  if(!st.draft.screens[target]) return;
  if(target!==st.scr && !['waitpeople'].includes(target)) st.sim.keybuf='';
  if(push!==false) st.sim.stack.push(st.scr);
  if(st.scr==='option' && target!=='option') st.sim.opts = {};
  st.scr = target; renderScrList();
}
function onPrevClick(ev){
  if(st.mode!=='prev') return;
  const S = st.sim;
  if(ev.target.closest('[data-popok]')){ S.popup = null; render(); return; }
  if(S.popup) return;
  const cb = ev.target.closest('[data-cart]');
  if(cb){ const i = +cb.dataset.i; const c = S.cart[i]; if(!c) return; const op = cb.dataset.cart;
    if(op==='inc') c.qty++; else if(op==='del') S.cart.splice(i,1); else { c.qty--; if(c.qty<=0) S.cart.splice(i,1); }
    logStep(null, (op==='inc'?'수량 증가: ':op==='del'?'주문서에서 삭제: ':'수량 감소: ')+c.name); render(); renderSimPanel(); return; }
  const qb = ev.target.closest('[data-qty]');
  if(qb){ const qel = findEl(qb.closest('[data-eid]').dataset.eid); if(qel && effState(qel)==='disabled') return;
    S.optQty = Math.max(1, (S.optQty||1) + (qb.dataset.qty==='inc'?1:-1)); logStep(null, '수량 '+S.optQty); render(); renderSimPanel(); return; }
  const kb = ev.target.closest('[data-kds]');
  if(kb){ const no = kb.dataset.kds; const o = S.orders.find(x=>x.no===no); if(!o) return;
    if(S.kdsDone[no]){ delete S.kdsDone[no]; S.popup = `${o.table} 주문을 준비중으로 되돌렸습니다.`; logStep(null, `KDS: ${o.table} 준비중으로 되돌림`); }
    else { S.kdsDone[no] = 1; S.popup = `${o.table} 주문을 완료 처리하였습니다.`; logStep(null, `KDS: ${o.table} 완료 처리`); }
    render(); renderSimPanel(); return; }
  const fb = ev.target.closest('[data-flag]');
  if(fb){ const id = fb.dataset.mid, flag = fb.dataset.flag; const m = st.draft.screens.main.els.find(e=>e.id===id); if(!m) return;
    const cur = S.pending[id] || S.over[id] || m.state || 'normal'; const next = cur===flag ? 'normal' : flag;
    const applied = S.over[id] || m.state || 'normal';
    if(next===applied) delete S.pending[id]; else S.pending[id] = next;
    logStep(null, `메뉴관리: ${m.name} → ${STATES[next]} (재수신 대기)`); render(); renderSimPanel(); return; }
  const node = ev.target.closest('[data-eid]'); if(!node) return;
  const el = findEl(node.dataset.eid); if(!el) return;
  runAction(el); render(); renderSimPanel();
}
function runAction(el){
  const S = st.sim; const s = effState(el);
  if(s==='disabled'){ return; }
  if(el.type==='menu' && s==='soldout'){ S.popup = el.soldMsg || `${el.name}은(는) 품절되었습니다.`; logStep(el,'품절 안내 표시'); return; }
  if(el.type==='option'){
    if(el.single){ scr().els.filter(o=>o.type==='option' && o.grp===el.grp).forEach(o=>{ if(o.id!==el.id) delete S.opts[o.id]; }); }
    if(S.opts[el.id]) delete S.opts[el.id]; else S.opts[el.id] = 1;
    logStep(el, '옵션 선택: '+el.text); return;
  }
  const a = el.action || {type:'none'};
  const label = ACTIONS[a.type] || a.type;
  switch(a.type){
    case 'none': return;
    case 'goto': logStep(el, '화면 이동 → '+(st.draft.screens[a.target]||{}).name); go(a.target); break;
    case 'back': logStep(el,'이전 화면'); { const p = S.stack.pop(); if(st.scr==='option') S.opts={}; st.scr = p || 'main'; renderScrList(); } break;
    case 'cat': st.cat = a.target; logStep(el, '카테고리: '+a.target); break;
    case 'popup': S.popup = a.msg || '안내'; logStep(el, '안내창: '+S.popup); break;
    case 'addCart': {
      const name = el.type==='menu' ? el.name : (el.text||'메뉴'); const price = el.type==='menu' ? Number(el.price)||0 : 0;
      const ex = S.cart.find(c=>c.name===name && !c.opts); if(ex) ex.qty++; else S.cart.push({name,price,qty:1,opts:''});
      logStep(el, '장바구니 담기: '+name); break; }
    case 'option': {
      if(el.type==='menu') S.ctx.menu = {name:el.name, price:Number(el.price)||0, id:el.id, desc:el.desc||'', img:el.img||''};
      S.opts = {}; S.optQty = 1; logStep(el, '옵션 창 열기: '+(el.name||'')); go(a.target||'option'); break; }
    case 'addCartCtx': {
      const m = S.ctx.menu; if(!m){ S.popup='선택한 메뉴가 없습니다.'; return; }
      const sc = scr(); const groups = {};
      sc.els.filter(o=>o.type==='option' && o.single).forEach(o=> groups[o.grp] = groups[o.grp] || false);
      const chosen = sc.els.filter(o=>o.type==='option' && S.opts[o.id]);
      chosen.forEach(o=>{ if(o.single) groups[o.grp] = true; });
      const miss = Object.entries(groups).filter(([g,v])=>!v);
      if(miss.length){ S.popup = '필수 옵션을 선택해 주십시오.'; logStep(el,'필수 옵션 미선택 안내'); return; }
      const price = m.price + chosen.reduce((s,o)=>s+(Number(o.addPrice)||0),0);
      const opts = chosen.map(o=>o.text).join(', ');
      const q = S.optQty||1; const ex = S.cart.find(c=>c.name===m.name && c.opts===opts); if(ex) ex.qty += q; else S.cart.push({name:m.name,price,qty:q,opts});
      logStep(el, `옵션 담기: ${m.name} (${opts||'옵션 없음'}) ${q}개`); S.optQty = 1;
      S.opts = {}; const p = S.stack.pop(); st.scr = p || 'main'; renderScrList(); break; }
    case 'checkout':
      if(!S.cart.length){ S.popup = '메뉴를 먼저 선택해 주십시오.'; logStep(el,'빈 장바구니 안내'); return; }
      logStep(el, '주문서 확인'); go(st.draft.screens[a.target] ? a.target : 'complete'); break;
    case 'order': {
      if(!S.cart.length){ S.popup = '메뉴를 선택해주세요.'; logStep(el,'빈 주문서 안내'); return; }
      const no = String(S.seq++); S.orders.push({no, table:S.table, items:clone(S.cart), at:Date.now()});
      logStep(el, `주문 전송: ${no}번 · ${won(cartTotal())}`); S.lastItems = clone(S.cart); S.cart = []; S.lastNo = no; S.stack = []; st.scr = a.target||'complete'; renderScrList(); break; }
    case 'clearCart': S.cart = []; logStep(el,'장바구니 비우기'); break;
    case 'posOpen': S.ctx.table = el.tableNo; logStep(el, `테이블 ${el.tableNo} 주문서 열기`); go(a.target||'posorder'); break;
    case 'posPay': {
      const t = S.ctx.table; const tot = tableTotal(t);
      if(!tot){ S.popup = '결제할 주문이 없습니다.'; logStep(el,'결제할 주문 없음 안내'); return; }
      const how = a.msg ? a.msg+' ' : '';
      S.orders = S.orders.filter(o=>String(o.table)!==String(t)); logStep(el, `테이블 ${t} ${how}결제 ${num(tot)}원`); S.stack = []; st.scr = a.target||'pos'; S.popup = `테이블 ${t} · ${num(tot)}원 ${how}결제가 완료되었습니다.`; renderScrList(); break; }
    case 'posCancel': {
      const t = S.ctx.table; if(!tableOrders(t).length){ S.popup = '취소할 주문이 없습니다.'; return; }
      S.orders = S.orders.filter(o=>String(o.table)!==String(t)); logStep(el, `테이블 ${t} 전체취소`); S.stack = []; st.scr = a.target||'pos'; S.popup = `테이블 ${t} 주문을 전체취소하였습니다.`; renderScrList(); break; }
    case 'key': {
      const k = a.msg; const max = Number(a.max)||11;
      if(k==='del') S.keybuf = (S.keybuf||'').slice(0,-1); else if((S.keybuf||'').length < max) S.keybuf = (S.keybuf||'') + k;
      if(max===4 && S.keybuf.length===4){
        if(S.keybuf==='0000'){ logStep(el,'관리자모드 비밀번호 확인'); S.keybuf=''; go(a.target||'pos'); }
        else { logStep(el,'관리자모드 비밀번호 오류'); S.keybuf=''; S.popup='비밀번호가 맞지 않습니다. (시안 비밀번호 0000)'; }
      }
      break; }
    case 'waitReg': {
      const b = S.keybuf||'';
      if(!/^01\d{8,9}$/.test(b)){ S.popup = '핸드폰 번호를 정확히 입력해 주십시오.'; logStep(el,'웨이팅 번호 오류 안내'); break; }
      logStep(el, '웨이팅 연락처 입력 완료'); go(a.target||'waitpeople'); break; }
    case 'waitPeople': {
      S.waitCount++; S.waitNo = S.waitCount; S.waitPeople = Number(a.msg)||1; S.keybuf='';
      logStep(el, `웨이팅 등록: ${S.waitPeople}명 · 대기 ${S.waitNo}번`); go(a.target||'waitdone'); break; }
    case 'resync': {
      const n = Object.keys(S.pending).length; Object.assign(S.over, S.pending); S.pending = {};
      logStep(el, `재수신: 메뉴판에 ${n}건 반영`); S.popup = n ? `재수신 완료. 메뉴 변경 ${n}건이 메뉴판에 반영되었습니다.` : '재수신 완료. 반영할 변경 사항이 없습니다.'; break; }
    default: logStep(el, label);
  }
}

const PROP_LABEL = {text:'문구',name:'메뉴 이름',price:'가격',desc:'설명',x:'X',y:'Y',w:'너비',h:'높이',bg:'배경색',color:'글자색',fs:'글자 크기',fw:'굵게',radius:'모서리',align:'정렬',state:'상태',action:'클릭 동작',note:'주석',img:'이미지',cat:'카테고리',addPrice:'추가 금액',tableNo:'테이블 번호',soldText:'품절 문구',lock:'잠금',grp:'묶음',single:'단일 선택',scope:'표시 대상',border:'테두리'};
function actLabel(a, screens){ if(!a||a.type==='none') return '동작 없음'; let s = ACTIONS[a.type]||a.type; if(a.target && screens[a.target]) s += ' → '+screens[a.target].name; else if(a.target) s += ' → '+a.target; if(a.msg) s += ` ("${a.msg}")`; return s; }
function fmtVal(k, v, screens){ if(k==='action') return actLabel(v, screens); if(k==='state') return STATES[v]||v||'기본'; if(k==='img') return v?'사용자 이미지':'없음'; if(k==='price'||k==='addPrice') return won(v); if(v===undefined||v===null||v==='') return '없음'; return String(v); }
function elName(e){ return `${TYPES[e.type]||e.type} "${(e.text||e.name||e.id).toString().slice(0,24)}"`; }
function diffScreen(before, after, screens){
  const out = []; const bm = {}; before.els.forEach(e=>bm[e.id]=e); const am = {}; after.els.forEach(e=>am[e.id]=e);
  after.els.forEach(e=>{ if(!bm[e.id]) out.push({k:'add', t:`추가: ${elName(e)}${e.action&&e.action.type!=='none'?' · '+actLabel(e.action,screens):''}`}); });
  before.els.forEach(e=>{ if(!am[e.id]) out.push({k:'del', t:`삭제: ${elName(e)}`}); });
  after.els.forEach(e=>{ const b = bm[e.id]; if(!b) return;
    const keys = new Set([...Object.keys(b),...Object.keys(e)]); keys.delete('added');
    const ch = []; let moved = false;
    keys.forEach(k=>{ if(JSON.stringify(b[k])===JSON.stringify(e[k])) return;
      if(['x','y'].includes(k)){ moved = true; return; }
      if(k==='note') return;
      ch.push(`${PROP_LABEL[k]||k}: ${fmtVal(k,b[k],screens)} → ${fmtVal(k,e[k],screens)}`); });
    if(moved) ch.unshift(`위치: (${b.x},${b.y}) → (${e.x},${e.y})`);
    if(ch.length) out.push({k:'mod', t:`변경: ${elName(b)} — ${ch.join(' / ')}`});
  });
  const bo = before.els.map(e=>e.id).filter(id=>am[id]).join(), ao = after.els.map(e=>e.id).filter(id=>bm[id]).join();
  if(bo!==ao) out.push({k:'mod', t:'요소 겹침 순서 변경'});
  return out;
}
function notesOf(screens, ids){ const r = []; (ids||SCREEN_ORDER).forEach(id=>{ const s = screens[id]; if(!s) return; s.els.forEach(e=>{ if(e.note) r.push({scr:id, scrName:s.name, el:e.id, elName:elName(e), note:e.note}); }); }); return r; }

${JSON.stringify(screen)}

function applyOps(ops){
  const sc = scr(); let n = 0;
  const allowed = new Set(['x','y','w','h','text','name','price','desc','cat','bg','color','fs','fw','radius','align','state','soldText','soldMsg','note','action','addPrice','grp','single','border']);
  ops.forEach(o=>{
    if(o.op==='update'){ const e = sc.els.find(x=>x.id===o.id); if(!e || !o.props) return; Object.entries(o.props).forEach(([k,v])=>{ if(allowed.has(k)) e[k] = v; }); n++; }
    else if(o.op==='remove'){ const i = sc.els.findIndex(x=>x.id===o.id); if(i>=0){ sc.els.splice(i,1); n++; } }
    else if(o.op==='add' && o.el && TYPES[o.el.type]){
      const e = {id:uid('n'), type:o.el.type, x:+o.el.x||400, y:+o.el.y||300, w:+o.el.w||200, h:+o.el.h||60, state:'normal', action:{type:'none'}, added:1};
      Object.entries(o.el).forEach(([k,v])=>{ if(allowed.has(k)) e[k]=v; });
      if(e.type==='menu' && sc.cats && !e.cat) e.cat = st.cat;
      sc.els.push(e); n++;
    }
  });
  // 품절 메뉴 클릭 안내는 사이 시뮬레이터 기본 동작으로 처리됨
  fixSel(); return n;
}

async function resolveNames(ids){
  if(st.store && st.store.mode==='supa'){ const need = [...new Set(ids.filter(i=>i && /^[0-9a-f-]{36}$/.test(i) && !(i in st.names)))]; if(!need.length) return;
    try{ const m = await st.store.names(need); need.forEach(i=> st.names[i] = m[i] || '사용자'); }catch(e){} return; }
  if(!st.user || !st.user.profiles) return;
  const need = [...new Set(ids.filter(i=>i && !(i in st.names)))]; if(!need.length) return;
  try{ const ps = await st.user.profiles(need); need.forEach(i=>{ st.names[i] = (ps[i] && ps[i].name) || '사용자'; }); }catch(e){}
}
function visibleReqs(){ return st.requests.filter(canSee); }

  const rs = visibleReqs().filter(r=>(!fs||r.status===fs)&&(!fp||r.priority===fp)&&(!q || (r.title+' '+r.store+' '+r.no).toLowerCase().includes(q)))
    .sort((a,b)=>b.createdAt-a.createdAt);
  $('#reqCnt').textContent = visibleReqs().length;
  $('#reqItems').innerHTML = rs.length ? rs.map(r=>`<div class="ri ${st.openReq===r.docId?'act':''}" data-r="${r.docId}">

function openRequest(id){
  st.openReq = id;

  st.timeline = [];
  st.tlUnsub = st.store.subTimeline(id, tl => { st.timeline = tl; resolveNames(tl.map(t=>t.by)).then(renderTimeline); renderTimeline(); });
  renderReqList(); renderReqDetail();
}

function renderTimeline(){

  T_.innerHTML = st.timeline.length ? st.timeline.map(t=>`<div class="it"><span class="who">${esc(nm(t.by))}</span>${t.role?` <span class="badge">${esc(ROLES[t.role]||'')}</span>`:''}${t.kind==='tech'?' <span class="badge b">기술 검토</span>':''}<span class="when">${fmtT(t.at)}</span>
    <div class="${t.kind==='log'?'log':''}" style="white-space:pre-wrap;margin-top:3px">${t.kind==='log'?'· ':''}${esc(t.text)}</div></div>`).join('') : '<span style="color:var(--sub)">이력 없음</span>';
}
function reqText(r){
  const ids = r.changed||[]; const lines = [];
  lines.push(`[메뉴잇 개발 요청] ${r.no} (v${r.version})`, `제목: ${r.title}`, `상태: ${r.status} / 우선순위: ${r.priority}`, `요청자: ${nm(r.requesterId)} (${ROLES[r.requesterRole]||''})`, `매장: ${r.store}${r.customer?' / '+r.customer:''}`, `대상: ${r.app} · ${ids.map(id=>(r.after[id]||{}).name).join(', ')}`, `접수일: ${fmtT(r.createdAt)}`, '', `현재 문제: ${r.problem||'-'}`, `원하는 기능: ${r.desired}`, '');
  const bs = Object.assign(clone(TEMPLATES), r.before||{}), as = Object.assign(clone(TEMPLATES), r.before||{}, r.after);
  ids.forEach(id=>{ lines.push(`■ ${as[id].name} 변경점`); diffScreen(bs[id], as[id], as).forEach(d=>lines.push(' - '+d.t)); });
  if((r.notes||[]).length){ lines.push('', '■ 주석'); r.notes.forEach((n,i)=>lines.push(` ${i+1}. [${n.scrName}] ${n.elName}: ${n.note}`)); }
  if(r.scenarioText){ lines.push('', '■ 시나리오', r.scenarioText); }
  if((r.steps||[]).length){ lines.push('', '■ 실행 기록'); r.steps.forEach((s,i)=>lines.push(` ${i+1}. [${s.scrName}] ${s.act}`)); }
  return lines.join('\n');
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('요청서를 복사하였습니다.'); }catch(e){ modal(`<h3>요청서 텍스트</h3><textarea style="height:50vh">${esc(t)}</textarea><div class="mfoot"><button data-close>닫기</button></div>`); } }

function runRequest(r, after){
  // 제출된 시안을 편집기 실행 모드로 열기 (저장된 시안은 건드리지 않음)
  confirmBox('현재 편집 중인 시안 대신 이 요청의 시안을 실행 모드로 엽니다. 편집 중인 시안은 그대로 보관됩니다.', ()=>{
    st.viewOnly = {keep: st.draft, keepEditing: st.editing};
    st.draft = {ver:VERSION, screens: Object.assign(clone(TEMPLATES), clone(r.before||{}), clone(after||r.after))};
    st.sim = newSim(); st.scr = (r.changed||[])[0] || 'main'; if(st.draft.screens[st.scr].base) st.scr = st.draft.screens[st.scr].base;
    st.undo=[]; st.redo=[]; switchTab('editor'); setMode('prev'); showViewBar(r);
  });
}
function showViewBar(r){
  let bar = $('#viewBar'); if(!bar){ bar = document.createElement('div'); bar.id='viewBar'; $('#center').insertBefore(bar, $('#stageWrap')); }
  bar.style.cssText = 'background:#7c3aed;color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;font-weight:700';
  bar.innerHTML = `<span>${esc(r.no)} 시안 실행 중 · 편집 내용은 저장되지 않습니다</span><span class="sp"></span><button id="vbEnd">내 시안으로 돌아가기</button>`;
  $('#mEdit').disabled = true; $('#bSubmit').disabled = true; $('#bReset').disabled = true; $('#bAi').disabled = true;
  $('#vbEnd').onclick = endViewOnly;
}
function endViewOnly(){
  if(!st.viewOnly) return; st.draft = st.viewOnly.keep; st.editing = st.viewOnly.keepEditing; st.viewOnly = null;
  const bar = $('#viewBar'); if(bar) bar.remove();
  $('#mEdit').disabled = false; $('#bSubmit').disabled = false; $('#bReset').disabled = false; $('#bAi').disabled = false;
  st.sim = newSim(); st.scr='main'; setMode('edit'); renderAll();
}
function loadIntoEditor(r){
  confirmBox('편집 중인 시안을 이 요청의 최신 시안으로 바꿉니다. 계속하시겠습니까?', ()=>{
    if(st.viewOnly) endViewOnly();
    st.draft = {ver:VERSION, screens:Object.assign(clone(TEMPLATES), clone(r.after))}; st.editing = {docId:r.docId, reqNo:r.no};
    st.undo=[]; st.redo=[]; st.sel=null; st.sim=newSim(); st.scr=(r.changed||[])[0]||'main'; st.cat=CATS[0]; saveDraftSoon(); switchTab('editor'); setMode('edit'); renderAll();
    toast('시안을 불러왔습니다. 수정 후 [제안 제출]을 누르면 재제출됩니다.');
  });
}

      ${st.downloads?'<button id="xDraft">시안 JSON 내보내기</button><button id="xHtml">전후 비교 HTML 내보내기</button>':''}

    <div class="card" style="margin-top:10px"><b>붙여넣기로 가져오기</b><textarea id="xPaste" rows="5" placeholder='{"kind":"menuit-draft", ...}'></textarea><div class="btnRow"><button id="xPasteGo">붙여넣은 JSON 불러오기</button></div><div id="xErr" class="err"></div></div>
    <div class="mfoot"><button data-close>닫기</button></div>`);

  const xd = $('#xDraft'); if(xd) xd.onclick = async ()=>{ try{ await st.downloads.save({filename:`메뉴잇_시안_${Date.now()}.json`, data:draftJson()}); }catch(e){} };
  const xh = $('#xHtml'); if(xh) xh.onclick = async ()=>{ try{ await st.downloads.save({filename:`메뉴잇_전후비교_${Date.now()}.html`, data:compareHtml()}); }catch(e){} };
  $('#xCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText(draftJson()); toast('복사하였습니다.'); }catch(e){ $('#xPaste').value = draftJson(); $('#xPaste').select(); toast('아래 칸에서 직접 복사하십시오.'); } };
  $('#xImp').onclick = ()=>{ $('#fileJson').value=''; $('#fileJson').click(); };

$('#fileJson').addEventListener('change', e=>{ const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=> importJson(r.result, $('#xErr')); r.readAsText(f); });
function importJson(txt, errEl){
  try{
    const o = JSON.parse(txt); let screens = null;
    if(o.kind==='menuit-draft') screens = o.screens;
    else if(o.kind==='menuit-proposal' && o.request) screens = Object.assign(clone(TEMPLATES), o.request.after);
    else throw 0;
    SCREEN_ORDER.forEach(id=>{ if(!screens[id] || !Array.isArray(screens[id].els)) screens[id] = clone(TEMPLATES[id]); });
    const s = snapshot(); st.draft.screens = screens; st.sel=null; commit(s); renderAll(); closeModal(); toast('시안을 불러왔습니다. 되돌리기로 취소할 수 있습니다.');
  }catch(e){ if(errEl) errEl.textContent = '메뉴잇 시안 JSON 형식이 아닙니다.'; }
}
function compareHtml(){
  const ch = changedScreens(); const after = st.draft.screens;
  const parts = ch.map(id=>{ const d = diffScreen(TEMPLATES[id], after[id], after); return `<h2>${esc(after[id].name)}</h2><ul>${d.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ul>${notesOf(after,[id]).map(n=>`<p><b>주석</b> ${esc(n.elName)}: ${esc(n.note)}</p>`).join('')}`; }).join('');
  return `<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><title>메뉴잇 전후 비교</title><body style="font-family:sans-serif;max-width:900px;margin:30px auto"><h1>메뉴잇 화면 변경 제안</h1><p>${fmtT(Date.now())} · 변경 화면 ${ch.length}개</p>${parts||'<p>변경 없음</p>'}</body></html>`;
}

/* =================== 권한 관리 =================== */
function renderAdmin(){
  const V = $('#adminView');
  if(st.store.mode==='supa'){
    const ids = Object.keys(st.rolesMap);
    V.innerHTML = `<div style="max-width:820px"><h2 style="margin-top:0">권한 관리</h2><div class="card adminList"><b>사용자 ${ids.length}명</b>
      ${ids.map(id=>`<div class="row"><div class="n">${esc(nm(id))}</div>${id===st.myId?'<span class="badge o">나</span>':`<select data-rid="${id}" style="width:auto">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${st.rolesMap[id].role===k?'selected':''}>${l}</option>`).join('')}</select>`}</div>`).join('')}</div></div>`;
    V.querySelectorAll('[data-rid]').forEach(s=> s.onchange = async ()=>{ try{ await st.store.setRole(s.dataset.rid, s.value); toast('저장되었습니다.'); st.reloadRoles && st.reloadRoles(); }catch(e){ toast(e.message||'저장에 실패하였습니다.'); } });
    return;
  }
  if(st.store.mode==='local'){ V.innerHTML = `<div class="card" style="max-width:720px"><h3 style="margin-top:0">권한 관리</h3>이 브라우저 전용 모드입니다. 상단의 보기 전환으로 역할별 화면을 확인하십시오. 로그인 기반 권한은 공유 모드(claude.ai 링크)에서만 동작합니다.</div>`; return; }
  const entries = Object.entries(st.rolesMap);
  V.innerHTML = `<div style="max-width:820px"><h2 style="margin-top:0">권한 관리</h2>
    <div class="card"><b>사용자 추가</b><div style="display:flex;gap:6px;margin-top:8px"><input id="aQ" placeholder="이름으로 검색"><button id="aSearch">검색</button></div><div id="aHits" class="adminList" style="margin-top:6px"></div></div>
    <div class="card adminList" style="margin-top:12px"><b>역할 지정 ${entries.length}명</b>
      <div class="row"><div class="n">${esc(nm(st.myId))}</div><span class="badge o">관리자 (소유자)</span></div>
      ${entries.map(([id,v])=>`<div class="row"><div class="n">${esc(nm(id))}</div><select data-rid="${id}" style="width:auto">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${v.role===k?'selected':''}>${l}</option>`).join('')}</select><button data-rdel="${id}">해제</button></div>`).join('')}
      <div style="font-size:13px;color:var(--sub);margin-top:8px">역할을 지정하지 않은 사용자는 고객(매장)으로 처리합니다.</div></div></div>`;
  const save = async m => { try{ await st.store.saveRoles(m); toast('저장되었습니다.'); }catch(e){ toast('권한 저장에 실패하였습니다.'); } };
  V.querySelectorAll('[data-rid]').forEach(s=> s.onchange = ()=>{ const m = clone(st.rolesMap); m[s.dataset.rid] = {role:s.value}; save(m); });
  V.querySelectorAll('[data-rdel]').forEach(b=> b.onclick = ()=>{ const m = clone(st.rolesMap); delete m[b.dataset.rdel]; save(m); });
  const doSearch = async ()=>{ const h = $('#aHits'); if(!st.user || !st.user.search){ h.textContent = '사용자 검색을 사용할 수 없습니다.'; return; }
    try{ const hits = await st.user.search($('#aQ').value.trim()); const list = (hits||[]).filter(x=>x.id!==st.myId);
      list.forEach(x=> st.names[x.id] = x.name || '사용자');
      h.innerHTML = list.length ? list.map(x=>`<div class="row"><div class="n">${esc(x.name||'사용자')}</div><select data-aid="${x.id}" style="width:auto">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><button data-aadd="${x.id}">추가</button></div>`).join('') : '<div style="color:var(--sub)">결과 없음</div>';
      h.querySelectorAll('[data-aadd]').forEach(b=> b.onclick = ()=>{ const id = b.dataset.aadd; const m = clone(st.rolesMap); m[id] = {role: h.querySelector(`[data-aid="${id}"]`).value}; save(m); });
    }catch(e){ h.textContent = '검색에 실패하였습니다.'; } };
  $('#aSearch').onclick = doSearch; $('#aQ').onfocus = ()=>{ if(!$('#aHits').innerHTML) doSearch(); };
}

/* =================== 공통 UI =================== */
function modal(html, wide){ closeModal(); const bg = document.createElement('div'); bg.className='modalBg'; bg.id='modalBg';
  bg.innerHTML = `<div class="modal ${wide?'wide':''}">${html}</div>`; document.body.appendChild(bg);
  bg.addEventListener('click', e=>{ if(e.target===bg || e.target.closest('[data-close]')) closeModal(); }); }
function closeModal(){ const m = $('#modalBg'); if(m) m.remove(); }
function confirmBox(msg, ok){ modal(`<h3>확인</h3><div>${esc(msg)}</div><div class="mfoot"><button data-close>취소</button><button class="pri" id="cfOk">확인</button></div>`); $('#cfOk').onclick = ()=>{ closeModal(); ok(); }; }
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600); }

function switchTab(t){
  st.tab = t; $$('.tabs [data-tab]').forEach(b=>b.classList.toggle('act', b.dataset.tab===t));
  $('#editorView').classList.toggle('hidden', t!=='editor'); $('#reqView').classList.toggle('hidden', t!=='req'); $('#adminView').classList.toggle('hidden', t!=='admin');
  if(t==='editor'){ fitStage(); render(); }
  if(t==='req'){ renderReqList(); renderReqDetail(); }
  if(t==='admin') renderAdmin();
}
function refreshRoleUi(){
  const role = myRole();
  $('#meBadge').textContent = ROLES[role] + (st.roleOverride ? ' 보기' : '');
  $('#tabAdmin').classList.toggle('hidden', !(role==='admin' || (st.isOwner)));
  const rs = $('#roleSwitch'); const canSwitch = st.store.mode!=='supa' && (st.store.mode==='local' || st.isOwner);
  if(st.store.mode==='supa'){ $('#meBadge').textContent = (st.me?st.me.name+' · ':'') + ROLES[role]; $('#bLogout').classList.remove('hidden'); }
  rs.classList.toggle('hidden', !canSwitch);
  if(canSwitch){
    const cur = st.store.mode==='local' ? role : (st.roleOverride||'');
    rs.innerHTML = (st.store.mode==='local' ? '' : '<option value="">보기 전환: 내 권한</option>') + Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${st.store.mode==='local'?'역할: ':'보기 전환: '}${v}</option>`).join('');
  }
  $('#fSt').innerHTML = `<option value="">전체 상태</option>` + STATUSES.map(s=>`<option>${s}</option>`).join('');
  if(st.tab==='req'){ renderReqList(); renderReqDetail(); }
  if(st.tab==='admin') renderAdmin();
}

/* =================== 이벤트 연결 =================== */
function bind(){
  $$('.tabs [data-tab]').forEach(b=> b.onclick = ()=>switchTab(b.dataset.tab));
  $('#scrList').addEventListener('click', e=>{ const n = e.target.closest('[data-scr]'); if(!n) return; st.scr = n.dataset.scr; st.sel=null; if(st.mode==='prev'){ st.sim.stack=[]; st.sim.popup=null; } renderAll(); });
  $('#mEdit').onclick = ()=>setMode('edit'); $('#mPrev').onclick = ()=>setMode('prev');
  $$('[data-add]').forEach(b=> b.onclick = ()=>addEl(b.dataset.add));
  $('#bUndo').onclick = doUndo; $('#bRedo').onclick = doRedo;
  $('#catSel').onchange = e=>{ st.cat = e.target.value; st.sel=null; render(); renderProps(); };
  $('#bCmp').onclick = openCompare; $('#bAi').onclick = openAi; $('#bSubmit').onclick = openSubmit; $('#bMore').onclick = openMore;
  $('#bReset').onclick = ()=> confirmBox(`'${scr().name}' 화면을 처음 상태로 되돌리시겠습니까?`, ()=>{ const s = snapshot(); st.draft.screens[st.scr] = clone(TEMPLATES[st.scr]); st.sel=null; commit(s); renderProps(); });
  $('#roleSwitch').onchange = e=>{ if(st.store.mode==='local'){ LS.set('menuit.studio.v2.role', e.target.value); } else { st.roleOverride = e.target.value || null; } refreshRoleUi(); };
  ['#fQ','#fSt','#fPr'].forEach(s=> $(s).addEventListener('input', renderReqList));
  stageEl.addEventListener('pointerdown', onStageDown); stageEl.addEventListener('pointermove', onStageMove);
  stageEl.addEventListener('pointerup', onStageUp); stageEl.addEventListener('pointercancel', onStageUp);
  stageEl.addEventListener('click', onPrevClick);
  stageEl.addEventListener('dblclick', e=>{ if(st.mode!=='edit') return; const ta = $('#props textarea[data-k="text"], #props input[data-k="name"]'); if(ta){ ta.focus(); ta.select(); } });
  window.addEventListener('resize', ()=>{ fitStage(); });
  const flush = ()=>{ if(saveTimer && !st.viewOnly){ clearTimeout(saveTimer); saveTimer = null; saveDraftNow(); } };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
  document.addEventListener('keydown', e=>{
    if(st.tab!=='editor' || $('#modalBg')) return;
    const tag = (e.target.tagName||'').toLowerCase(); if(['input','textarea','select'].includes(tag)) return;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); doRedo(); return; }
    if(st.mode!=='edit' || !st.sel) return;
    if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
    const el = findEl(st.sel); if(!el || el.lock) return; const d = e.shiftKey ? 10 : 1;
    const mv = {ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key];
    if(mv){ e.preventDefault(); if(!pendingSnap) pendingSnap = snapshot(); el.x += mv[0]; el.y += mv[1]; render(); clearTimeout(window._nud); window._nud = setTimeout(()=>{ if(pendingSnap){ commit(pendingSnap); pendingSnap=null; renderProps(); } }, 500); }
  });
}

/* =================== 시작 =================== */
async function init(){
  deviceEl = document.createElement('div'); deviceEl.className='device';
  stageEl = document.createElement('div'); stageEl.className='stage'; deviceEl.appendChild(stageEl); $('#stageWrap').appendChild(deviceEl);
  st.draft = newDraft();
  bind(); fitStage(); renderAll();

  // 깃허브 페이지 앱: Supabase 로그인
  st.downloads = {save: async ({filename, data})=>{ const b = new Blob([data], {type: filename.endsWith('.html')?'text/html':'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }};
  $('#bAi').classList.add('hidden');
  const me = await ensureLogin();
  st.me = me; st.myId = me.id; st.names[me.id] = me.name; st.store = SupaStore(me.token);
  $('#storeMode').textContent = '서버 저장'; $('#storeMode').className = 'badge g';
  return afterStore();
}
async function ensureLogin(){
  let tok = LS.get(TOKEN_KEY, null);
  if(tok){ try{ const m = await rpc('vs_me', {p_token:tok}); if(m && m.id) return Object.assign(m, {token:tok}); }catch(e){ if(e.code==='network'){ toast(e.message); } } }
  return new Promise(res=>{
    const L = $('#login'); L.classList.remove('hidden'); let staff = false;
    const setMode = v => { staff = v; $('#lgC').classList.toggle('act', !v); $('#lgS').classList.toggle('act', v); $('#lgCust').classList.toggle('hidden', v); $('#lgStaff').classList.toggle('hidden', !v); $('#lgErr').textContent=''; };
    $('#lgC').onclick = ()=>setMode(false); $('#lgS').onclick = ()=>setMode(true);
    $('#lgGo').onclick = async ()=>{
      const name = $('#lgName').value.trim(); if(!name){ $('#lgErr').textContent = '이름을 입력해 주십시오.'; return; }
      if(!staff && !$('#lgStore').value.trim()){ $('#lgErr').textContent = '매장명을 입력해 주십시오.'; return; }
      $('#lgGo').disabled = true;
      try{ const r = await rpc('vs_register', {p_name:name, p_store: staff?'':$('#lgStore').value.trim(), p_role: staff?$('#lgRole').value:'customer', p_code: staff?$('#lgCode').value.trim():''});
        LS.set(TOKEN_KEY, r.token); L.classList.add('hidden'); res(r);
      }catch(e){ $('#lgErr').textContent = e.message || '시작하지 못했습니다.'; }
      $('#lgGo').disabled = false;
    };
  });
}
async function initClaudeStore(){
  let db = null, user = null;
  if(window.claude && typeof window.claude.use === 'function'){
    try{ [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){}
    try{ st.sample = await claude.use('sample'); }catch(e){ st.sample = null; }
    try{ st.downloads = await claude.use('downloads'); }catch(e){ st.downloads = null; }
  }
  let myId = null;
  if(db && user){ try{ myId = await user.id(); }catch(e){} }
  if(db && myId){
    st.store = CloudStore(db, user, myId); st.user = user; st.myId = myId;
    try{ st.isOwner = !!(await user.isOwner()); }catch(e){ st.isOwner = false; }
    $('#storeMode').textContent = '공유 저장'; $('#storeMode').className = 'badge g';
  } else {
    st.store = LocalStore(); st.myId = await st.store.me(); st.names[st.myId] = '나';
    $('#storeMode').textContent = '이 브라우저에만 저장'; $('#storeMode').className = 'badge y';
  }
  if(!st.sample) $('#bAi').classList.add('hidden');
  return afterStore();
}
async function afterStore(){
  if(st.user || st.store.mode==='supa') resolveNames([st.myId]).then(()=>refreshRoleUi());

  // 시안 복원
  try{ const d = await st.store.loadDraft(); if(d && d.screens && d.ver===VERSION){ SCREEN_ORDER.forEach(id=>{ if(!d.screens[id]) d.screens[id] = clone(TEMPLATES[id]); }); { const lg = d.screens.main.els.find(e=>e.id==='m_logo'); if(lg && (!lg.action || lg.action.type==='none')) lg.action = {type:'goto',target:'adminpin'}; } st.draft = {ver:d.ver, screens:d.screens, updatedAt:d.updatedAt}; st.editing = d.editing || null; } }catch(e){}
  renderAll();

  // 권한
  st.store.subRoles(m => { st.rolesMap = m || {}; resolveNames(Object.keys(st.rolesMap)).then(refreshRoleUi); refreshRoleUi(); });
  // 요청 목록
  let loaded = false; const to = setTimeout(()=>{ if(!loaded) toast('요청함을 불러오는 중입니다. 연결 상태를 확인하십시오.'); }, 10000);
  st.store.subRequests(list => { loaded = true; clearTimeout(to); st.requests = list || [];
    resolveNames(st.requests.flatMap(r=>[r.requesterId,r.salesId,r.csId])).then(()=>{ if(st.tab==='req'){ renderReqList(); renderReqDetail(); } });
    $('#reqCnt').textContent = visibleReqs().length;
    if(st.tab==='req'){ renderReqList(); if(!$('#reqDetail textarea:focus') && !$('#reqDetail select:focus')) renderReqDetail(); }
  }, e => { clearTimeout(to); toast((e && e.message) || '요청함을 불러오지 못했습니다.'); });
  refreshRoleUi();
}
$('#bLogout').onclick = ()=> confirmBox('이 기기에서 나가시겠습니까? 다시 들어오면 새 사용자로 시작합니다.', ()=>{ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} location.reload(); });
let _inst = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); _inst = e; $('#bInstall').classList.remove('hidden'); });
$('#bInstall').onclick = async ()=>{ if(!_inst) return; _inst.prompt(); try{ await _inst.userChoice; }catch(e){} _inst = null; $('#bInstall').classList.add('hidden'); };
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
