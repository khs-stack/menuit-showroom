<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>메뉴잇 설치 미리보기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b7a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="설치 미리보기">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one column, phone first — choices, photo stage, three actions. */
:root{--bg:#eef1f2;--surface:#fff;--line:#cdd5d9;--fg:#162024;--muted:#5b686e;--accent:#0f6b7a;--accent-fg:#fff;--accent-soft:#d5ebee;--warn:#a3520c;--stage:#1d2629;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171a;--surface:#182124;--line:#2b383d;--fg:#e3eaec;--muted:#93a2a8;--accent:#4fb3c3;--accent-fg:#071417;--accent-soft:#163b42;--warn:#f0a660;--stage:#0a0f11;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171a;--surface:#182124;--line:#2b383d;--fg:#e3eaec;--muted:#93a2a8;--accent:#4fb3c3;--accent-fg:#071417;--accent-soft:#163b42;--warn:#f0a660;--stage:#0a0f11;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:980px;margin:0 auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px}
h1{margin:0;font-size:17px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.opt{display:flex;align-items:center;gap:6px}
.opt b{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.stage{position:relative;flex:1;min-height:300px;background:var(--stage);border-radius:12px;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;color:#dfe7ea}
.empty p{margin:0;max-width:30em;color:#a9b6bb;font-size:14px}
.big{border:0;border-radius:12px;padding:16px 26px;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-fg);min-width:220px}
.big.ghost{background:transparent;border:1px solid #5b686e;color:#dfe7ea;font-size:15px;padding:11px 20px}
.status{position:absolute;left:10px;top:10px;right:10px;background:rgba(10,15,17,.78);color:#fff;font-size:13.5px;padding:8px 12px;border-radius:9px;pointer-events:none}
.padbar{position:absolute;display:flex;gap:4px;background:rgba(10,15,17,.85);border-radius:10px;padding:4px;transform:translate(-50%,0)}
.padbar button{border:0;background:#2b383d;color:#fff;border-radius:7px;min-width:42px;height:38px;font-weight:700;font-size:16px}
.padbar button.del{background:#7a2620;font-size:14px;padding:0 10px}
.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.actions button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 6px;font-weight:600}
.actions button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.actions button[aria-pressed="true"]{background:var(--accent-soft)}
.actions button:disabled{opacity:.45;cursor:not-allowed}
.tip{margin:0;font-size:12.5px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(5,8,10,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal div{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:92%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.modal img{width:100%;border-radius:6px}
.modal .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-direction:row;padding:0;max-height:none;overflow:visible}
.modal .top button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:30;max-width:90vw}
</style></head><body>
<div id="app">
  <div style="display:flex;align-items:center;gap:8px"><h1 style="margin-right:auto">메뉴잇 설치 미리보기</h1><button id="bInstall" hidden style="border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px">앱으로 설치</button></div>
  <div class="opts">
    <div class="opt"><b>색상</b><div class="seg"><button data-color="white" aria-pressed="true">화이트</button><button data-color="black" aria-pressed="false">블랙</button></div></div>
    <div class="opt"><b>결제</b><div class="seg"><button data-pay="postpaid" aria-pressed="true">후불형</button><button data-pay="prepaid" aria-pressed="false">선불형</button></div></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="empty" id="empty">
      <button class="big" id="bPick">매장 사진 올리기</button>
      <button class="big ghost" id="bCam">카메라로 찍기</button>
      <p>사진 속 테이블을 찾아서 오더패드를 자동으로 놓아줌</p>
    </div>
    <div class="status" id="status" hidden></div>
    <div class="padbar" id="padbar" hidden><button id="pSmall" aria-label="작게">−</button><button id="pBig" aria-label="크게">+</button><button class="del" id="pDel">삭제</button></div>
  </div>
  <div class="actions" id="actions" hidden>
    <button id="bNew">사진 바꾸기</button>
    <button id="bBefore" aria-pressed="false">설치 전 보기</button>
    <button class="primary" id="bSave">이미지 저장</button>
  </div>
  <p class="tip" id="tip" hidden>오더패드는 끌어서 옮김. 빈 곳을 누르면 하나 더 놓임. 누르면 크기 조절·삭제.</p>
</div>
<input type="file" id="fPick" accept="image/*" hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>

<script type="module">
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9);
const raf = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
let toastT; function toast(m) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function status(m) { $('#status').hidden = !m; $('#status').textContent = m || ''; }

// ---------- products (official orderpad EZ images; base x = where the stand meets the table) ----------
const PRODUCTS = { 'postpaid-white': 0.484, 'postpaid-black': 0.484, 'prepaid-white': 0.412, 'prepaid-black': 0.412 };
const PAD_CM = 33, TABLE_CM = 120;   // orderpad with stand: 27.3 x 33cm (manual). 4-seat table ~120cm.
const prodImg = {};
let color = 'white', pay = 'postpaid';
try { color = localStorage.getItem('mis-color') || 'white'; pay = localStorage.getItem('mis-pay') || 'postpaid'; } catch (e) { }
async function loadProducts() { await Promise.all(Object.keys(PRODUCTS).map(async k => { try { prodImg[k] = await loadImg(srcFor(k)); } catch (e) { } })); }
function srcFor(k) { const el = document.getElementById('img-' + k); return el ? el.textContent.trim() : k + '.png'; }
const curKey = () => pay + '-' + color;

// ---------- state ----------
let photo = null, W = 0, H = 0, pads = [], sel = null, before = false;
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
let V = { s: 1, ox: 0, oy: 0 }, dpr = 1;
function fit() { if (!photo) return; const sw = stage.clientWidth, sh = stage.clientHeight; const s = Math.min(sw / W, sh / H); V = { s, ox: (sw - W * s) / 2, oy: (sh - H * s) / 2 }; }
function resize() { dpr = devicePixelRatio || 1; cv.width = Math.round(stage.clientWidth * dpr); cv.height = Math.round(stage.clientHeight * dpr); fit(); draw(); }
new ResizeObserver(resize).observe(stage);

function padRect(p) { const img = prodImg[curKey()]; const asp = img ? img.width / img.height : 0.83; const h = p.h, w = h * asp; const bx = PRODUCTS[curKey()]; return { x: p.x - w * bx, y: p.y - h, w, h }; }
function drawPad(c, p) {
  const r = padRect(p), img = prodImg[curKey()];
  const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, r.h * 0.22); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.translate(p.x, p.y); c.scale(1, 0.18); c.translate(-p.x, -p.y); c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, r.h * 0.22, 0, 7); c.fill(); c.restore();
  if (img) c.drawImage(img, r.x, r.y, r.w, r.h);
}
function scene(c, withPads) {
  c.drawImage(photo, 0, 0, W, H);
  if (withPads) [...pads].sort((a, b) => a.y - b.y).forEach(p => drawPad(c, p));
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  $('#empty').hidden = !!photo; $('#actions').hidden = !photo; $('#tip').hidden = !photo;
  if (!photo) { $('#padbar').hidden = true; return; }
  ctx.setTransform(dpr * V.s, 0, 0, dpr * V.s, dpr * V.ox, dpr * V.oy); ctx.imageSmoothingQuality = 'high';
  scene(ctx, !before);
  const p = pads.find(q => q.id === sel);
  if (p && !before) {
    const r = padRect(p); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2 / V.s; ctx.setLineDash([6 / V.s, 4 / V.s]); ctx.strokeRect(r.x, r.y, r.w, r.h); ctx.setLineDash([]);
    const bar = $('#padbar'); bar.hidden = false;
    let top = V.oy + (p.y) * V.s + 8; if (top > stage.clientHeight - 50) top = V.oy + r.y * V.s - 50;
    bar.style.left = clamp(V.ox + p.x * V.s, 90, stage.clientWidth - 90) + 'px'; bar.style.top = clamp(top, 4, stage.clientHeight - 46) + 'px';
  } else $('#padbar').hidden = true;
}

// ---------- choices ----------
function syncChoices() { $$('[data-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === color)); $$('[data-pay]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pay === pay)); try { localStorage.setItem('mis-color', color); localStorage.setItem('mis-pay', pay); } catch (e) { } draw(); }
$$('[data-color]').forEach(b => b.onclick = () => { color = b.dataset.color; syncChoices(); });
$$('[data-pay]').forEach(b => b.onclick = () => { pay = b.dataset.pay; syncChoices(); });

// ---------- photo in ----------
$('#bPick').onclick = () => $('#fPick').click(); $('#bCam').onclick = () => $('#fCam').click(); $('#bNew').onclick = () => $('#fPick').click();
for (const id of ['#fPick', '#fCam']) $(id).onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) takePhoto(f); };
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('drop', e => { e.preventDefault(); const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')); if (f) takePhoto(f); });
async function takePhoto(file) {
  try {
    const url = URL.createObjectURL(file); const im = await loadImg(url);
    const sc = Math.min(1, 2400 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    photo = c; W = c.width; H = c.height; pads = []; sel = null; before = false; $('#bBefore').setAttribute('aria-pressed', 'false');
    fit(); draw(); detect();
  } catch (e) { toast('사진을 열지 못함. 다른 사진으로 다시'); }
}

// ---------- auto detect (on-device YOLOE model: tables + people/chairs) ----------
const ORT_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.bundle.min.mjs';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort-wasm-simd-threaded.wasm';
let sessP = null;
async function getBuf(url, label) {
  const r = await fetch(url); if (!r.ok) throw new Error('파일 받기 실패');
  const total = +r.headers.get('content-length') || 0; if (!r.body || !total) return r.arrayBuffer();
  const rd = r.body.getReader(), out = new Uint8Array(total); let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; out.set(value, got); got += value.length; status(`${label} ${Math.round(got / total * 100)}%`); }
  return out.buffer;
}
function session() {
  if (!sessP) sessP = (async () => {
    status('준비 중… (처음 한 번만 조금 걸림)');
    const ort = await import(ORT_URL);
    ort.env.wasm.wasmBinary = await getBuf(WASM_URL, '준비 중'); ort.env.wasm.numThreads = 1;
    const md = document.getElementById('modelData');
    const model = md ? await (await fetch(md.textContent.trim())).arrayBuffer() : await getBuf('table-seg.model.wasm', '테이블 인식 준비 중');
    return { ort, sess: await ort.InferenceSession.create(model, { executionProviders: ['wasm'] }) };
  })().catch(e => { sessP = null; throw e; });
  return sessP;
}
async function detect() {
  try {
    const { ort, sess } = await session();
    status('테이블 찾는 중…'); await raf();
    const tables = await findTables(ort, sess, photo, 0.15);
    pads = tables.map(t => ({ id: uid(), x: t.ax, y: t.ay, h: clamp(t.topW * PAD_CM / TABLE_CM, H * 0.04, H * 0.6) }));
    draw();
    if (pads.length) { status(`테이블 ${pads.length}개에 오더패드를 놓음`); setTimeout(() => status(''), 3000); }
    else status('테이블을 못 찾음. 오더패드를 놓을 곳을 눌러주세요');
  } catch (e) { console.error(e); status('자동 인식이 안 됨 (인터넷 확인). 놓을 곳을 직접 눌러도 됨'); }
}
async function findTables(ort, sess, img, thr) {
  const SZ = 640, IW = img.width, IH = img.height, r = Math.min(SZ / IW, SZ / IH), nw = Math.round(IW * r), nh = Math.round(IH * r), px = Math.floor((SZ - nw) / 2), py = Math.floor((SZ - nh) / 2);
  const c = document.createElement('canvas'); c.width = c.height = SZ; const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#727272'; g.fillRect(0, 0, SZ, SZ); g.drawImage(img, px, py, nw, nh);
  const d = g.getImageData(0, 0, SZ, SZ).data, N = SZ * SZ, inp = new Float32Array(3 * N);
  for (let i = 0; i < N; i++) { inp[i] = d[i * 4] / 255; inp[i + N] = d[i * 4 + 1] / 255; inp[i + 2 * N] = d[i * 4 + 2] / 255; }
  const out = await sess.run({ [sess.inputNames[0]]: new ort.Tensor('float32', inp, [1, 3, SZ, SZ]) });
  const o0 = out[sess.outputNames[0]], o1 = out[sess.outputNames[1]], A = o0.dims[2], D = o0.data, P = o1.data, PM = o1.dims[2], NC = o0.dims[1] - 36;
  const dets = [];
  for (let i = 0; i < A; i++) {
    let bs = 0; for (let k = 0; k < 4; k++) bs = Math.max(bs, D[(4 + k) * A + i]); // classes 0-3 = table words
    if (bs < thr) continue;
    const cx = D[i], cy = D[A + i], bw = D[2 * A + i], bh = D[3 * A + i], coef = new Float32Array(32);
    for (let k = 0; k < 32; k++) coef[k] = D[(4 + NC + k) * A + i];
    dets.push({ s: bs, x0: cx - bw / 2, y0: cy - bh / 2, x1: cx + bw / 2, y1: cy + bh / 2, coef });
  }
  dets.sort((a, b) => b.s - a.s);
  const iou = (a, b) => { const ix = Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)), iy = Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0)), I = ix * iy; return I / ((a.x1 - a.x0) * (a.y1 - a.y0) + (b.x1 - b.x0) * (b.y1 - b.y0) - I); };
  const keep = []; for (const t of dets) if (!keep.some(k => iou(k, t) > 0.45)) keep.push(t);
  const s4 = SZ / PM, res = [];
  for (const t of keep) {
    const gx0 = Math.max(0, Math.floor(t.x0 / s4)), gy0 = Math.max(0, Math.floor(t.y0 / s4)), gx1 = Math.min(PM, Math.ceil(t.x1 / s4)), gy1 = Math.min(PM, Math.ceil(t.y1 / s4)), gw = gx1 - gx0, gh = gy1 - gy0;
    if (gw < 2 || gh < 2) continue;
    const m = new Uint8Array(gw * gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) { let v = 0; const o = (gy0 + y) * PM + gx0 + x; for (let k = 0; k < 32; k++) v += t.coef[k] * P[k * PM * PM + o]; m[y * gw + x] = v > 0 ? 1 : 0; }
    let top = -1, bot = -1; for (let y = 0; y < gh; y++) { let n = 0; for (let x = 0; x < gw; x++) n += m[y * gw + x]; if (n > gw * 0.15) { if (top < 0) top = y; bot = y; } }
    if (top < 0) continue;
    const ay = top + (bot - top) * 0.22, ry = Math.round(ay); let sx = 0, n = 0, l = -1, rr = -1;
    for (let x = 0; x < gw; x++) if (m[ry * gw + x]) { sx += x; n++; if (l < 0) l = x; rr = x; }
    if (!n) continue;
    const toX = gx => clamp(((gx0 + gx) * s4 - px) / r, 0, IW), toY = gy => clamp(((gy0 + gy) * s4 - py) / r, 0, IH);
    res.push({ ax: toX(sx / n), ay: toY(ay), topW: (rr - l + 1) * s4 / r });
  }
  return res;
}

// ---------- touch: drag pads, tap to add ----------
const toImg = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left - V.ox) / V.s, y: (e.clientY - b.top - V.oy) / V.s }; };
function hit(pt) { for (const p of [...pads].sort((a, b) => b.y - a.y)) { const r = padRect(p); if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= p.y + r.h * 0.05) return p; } return null; }
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (!photo || before) return; cv.setPointerCapture(e.pointerId);
  const pt = toImg(e), p = hit(pt);
  drag = p ? { p, dx: pt.x - p.x, dy: pt.y - p.y, moved: false, sx: e.clientX, sy: e.clientY } : { add: pt, sx: e.clientX, sy: e.clientY };
  if (p) { sel = p.id; draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag || !drag.p) return; if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
  const pt = toImg(e); drag.p.x = clamp(pt.x - drag.dx, 0, W); drag.p.y = clamp(pt.y - drag.dy, 0, H); draw();
});
cv.addEventListener('pointerup', e => {
  const d = drag; drag = null; if (!d) return;
  if (d.add) {
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 8) return;
    if (sel) { sel = null; draw(); return; }
    if (d.add.x < 0 || d.add.y < 0 || d.add.x > W || d.add.y > H) return;
    const hs = pads.map(p => p.h).sort((a, b) => a - b); const h = hs.length ? hs[hs.length >> 1] : H * 0.22;
    const p = { id: uid(), x: d.add.x, y: d.add.y, h }; pads.push(p); sel = p.id; status(''); draw();
  }
});
$('#pBig').onclick = () => { const p = pads.find(q => q.id === sel); if (p) { p.h *= 1.12; draw(); } };
$('#pSmall').onclick = () => { const p = pads.find(q => q.id === sel); if (p) { p.h /= 1.12; draw(); } };
$('#pDel').onclick = () => { pads = pads.filter(q => q.id !== sel); sel = null; draw(); };
$('#bBefore').onclick = () => { before = !before; $('#bBefore').setAttribute('aria-pressed', before); $('#bBefore').textContent = before ? '설치 후 보기' : '설치 전 보기'; draw(); };

// ---------- save ----------
$('#bSave').textContent = /Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare ? '저장·공유' : '이미지 저장';
$('#bSave').onclick = async () => {
  if (!photo) return;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; scene(g, true);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  const name = `메뉴잇_설치예상_${pay === 'prepaid' ? '선불형' : '후불형'}_${color === 'black' ? '블랙' : '화이트'}.jpg`;
  const file = new File([blob], name, { type: 'image/jpeg' });
  if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: '메뉴잇 설치 예상 이미지' }); return; } catch (e) { if (e?.name === 'AbortError') return; } }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('저장함'); return; } catch (e) { }
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div><div class="top"><b>이미지를 길게 누르거나 우클릭해서 저장</b><button>닫기</button></div><img alt="설치 예상 이미지"></div>';
  m.querySelector('img').src = c.toDataURL('image/jpeg', 0.92); m.querySelector('button').onclick = () => m.remove(); document.body.appendChild(m);
};

loadProducts().then(() => { syncChoices(); resize(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
let installEv = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; $('#bInstall').hidden = false; });
const standaloneMode = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (!standaloneMode && /iPhone|iPad/i.test(navigator.userAgent)) $('#bInstall').hidden = false;
$('#bInstall').onclick = async () => {
  if (installEv) { installEv.prompt(); await installEv.userChoice.catch(() => { }); installEv = null; $('#bInstall').hidden = true; return; }
  toast('Safari 아래 공유 버튼 → 홈 화면에 추가');
};
</script>
</body></html>
